<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102348" />
  <meta http-equiv="refresh" content="0; url=./client/index.html" />
  <title>ZAVEN - Smart Inventory</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #182844;
      background: #f4f7fc
    }

    * {
      box-sizing: border-box
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px
    }

    main {
      max-width: 520px;
      padding: 36px;
      border: 1px solid #e5ebf4;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 24px 70px #12264a14;
      text-align: center
    }

    .mark {
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(145deg, #3488fa, #1d5dd9);
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 9px 22px #2875f033
    }

    h1 {
      margin: 0;
      color: #12284b;
      letter-spacing: .12em;
      font-size: 22px
    }

    p {
      color: #77859c;
      line-height: 1.65;
      font-size: 14px
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #2875f0;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px
    }

    a:hover {
      background: #1d62d6
    }
  </style>
</head>

<body>
  <main>
    <div class="mark" aria-hidden="true">Z</div>
    <h1>ZAVEN</h1>
    <p>Membuka aplikasi Smart Inventory…<br />Jika tidak berpindah otomatis, tekan tombol di bawah jika mau menghubungkan supabase.</p>
    <a href="./client/index.html">Buka Smart Inventory</a>
  </main>
  <script>window.location.replace('./client/index.html');</script>
</body>

</html>
