<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102348" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZAVEN" />
    <meta name="description" content="Kelola stok, barang, kategori, dan supplier dengan mudah." />

    <!-- Link PWA Web App Manifest & Icons -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon.png" />

    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Sembunyikan opsi demo, install, dan setup */
      .demo-button,
      .install-app-button,
      .login-divider,
      .login-setup,
      .login-legal {
        display: none !important;
      }

      /* Sembunyikan tombol hapus (ikon tempat sampah) */
      .action-icon.danger,
      [data-delete-product],
      [data-delete-category],
      [data-delete-supplier] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      // Konfigurasi Kredensial Supabase
      const supaConfig = {
        url: 'https://aknwaplmsrcnlrrfbpdo.supabase.co',
        key: 'sb_publishable_uhrdYcA5mlQ34ERUApRMjQ_JMNALmzA',
        productsTable: 'items',
        categoriesTable: '',
        suppliersTable: ''
      };

      localStorage.setItem('zaven-supabase-config-v1', JSON.stringify(supaConfig));
      localStorage.setItem('supabaseUrl', supaConfig.url);
      localStorage.setItem('supabaseKey', supaConfig.key);

      // Registrasi PWA Service Worker
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('PWA Service Worker Aktif:', reg.scope))
            .catch(err => console.error('PWA Service Worker Gagal:', err));
        });
      }
    </script>

    <!-- Script Utama -->
    <script defer src="./app.js"></script>
  </body>
</html>
